[project]
name = "proyectofinal-practica"
version = "0.1.0"
description = "Tienda online de Calzado Fermin (Reflex + MySQL)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "reflex==0.10.1",
    "pydantic>=2.12,<3.0",
    "sqlmodel==0.0.30",
    "sqlalchemy==2.0.46",
    "alembic==1.18.1",
    "pymysql==1.1.2",
    "cryptography==46.0.3",
    "python-dotenv==1.2.1",
    "google-api-python-client==2.188.0",
    "google-auth-httplib2==0.3.0",
    "google-auth-oauthlib==1.2.4",
    "reflex-local-auth==0.5.0",
]

[tool.uv]
# The app is run from the source tree, not installed as a package.
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", ".web", ".states", "uploaded_files", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
# El tablero embebe CSS y JavaScript en strings largas a proposito.
"tools/tablero_backlog.py" = ["E501"]
